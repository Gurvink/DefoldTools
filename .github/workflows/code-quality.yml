
name: Lua Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luacheck:
    name: Lua Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.2"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install Luacheck
        run: luarocks install luacheck

      - name: Find Lua files
        run: |
          find . -type f \
            \( -name "*.lua" \
            -o -name "*.script" \
            -o -name "*.gui_script" \
            -o -name "*.render_script" \
            -o -name "*.editor_script" \) \
            -not -path "./.git/*" \
            -not -path "./.luarocks/*" \
            -print0 > /tmp/lua-files

      - name: Check Lua syntax
        run: |
          if [ -s /tmp/lua-files ]; then
            xargs -0 -r -n 1 luac -p < /tmp/lua-files
          else
            echo "No Lua files found"
          fi

      - name: Run Luacheck
        run: |
          if [ -s /tmp/lua-files ]; then
            xargs -0 -r luacheck \
              --config .luacheckrc \
              < /tmp/lua-files
          else
            echo "No Lua files found"
          fi
