
name: Lua Formatting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stylua:
    name: Check Lua Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: >-
            --check
            --glob '**/*.lua'
            --glob '**/*.script'
            --glob '**/*.gui_script'
            --glob '**/*.render_script'
            --glob '**/*.editor_script'
            --glob '!**/.luarocks/**'
            .
